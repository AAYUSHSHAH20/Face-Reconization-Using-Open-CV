{% extends 'face_app/base.html' %}
{% load static %}

{% block title %}Live Face Detection{% endblock %}

{% block extra_css %}
<style>
    #video-container {
        position: relative;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 8px;
    }
    
    #video-feed {
        width: 100%;
        background-color: #f0f2f5;
    }
    
    .face-box {
        position: absolute;
        border: 3px solid #2ecc71;
        z-index: 100;
    }
    
    .face-label {
        position: absolute;
        background-color: rgba(46, 204, 113, 0.8);
        color: white;
        padding: 3px 6px;
        font-size: 12px;
        border-radius: 3px;
        z-index: 101;
    }
    
    .confidence-label {
        position: absolute;
        background-color: rgba(52, 152, 219, 0.8);
        color: white;
        padding: 2px 5px;
        font-size: 11px;
        border-radius: 3px;
        z-index: 101;
    }
    
    .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h1 class="display-5">Live Face Recognition</h1>    
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-4">
                <div id="video-container" class="mb-3">
                    <video id="video-feed" autoplay playsinline></video>
                    <div id="overlay"></div>
                </div>
                
                <div class="controls">
                    <button id="start-camera" class="btn btn-primary">
                        <i class="fas fa-video me-2"></i>Start Camera
                    </button>
                    <button id="stop-camera" class="btn btn-secondary" disabled>
                        <i class="fas fa-stop-circle me-2"></i>Stop Camera
                    </button>
                </div>
                
                <div class="mt-3 text-center text-muted small">
                    <p>Enliven your world with the life of time animation.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/webcam.js' %}"></script>
{% endblock %}
